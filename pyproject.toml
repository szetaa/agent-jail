[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-jail"
version = "0.1.6"
description = "Zero-overhead, OS-level sandboxing for autonomous AI agents on macOS and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ralph" }
]
keywords = ["ai", "agents", "sandbox", "security", "seatbelt", "bubblewrap", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/szetaa/agent-jail"
Repository = "https://github.com/szetaa/agent-jail"
Issues = "https://github.com/szetaa/agent-jail/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agent-jail = "agent_jail.cli:main"
aj = "agent_jail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_jail"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
